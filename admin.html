
<style>
/* GY — Clean Admin Dashboard */
body {
  padding: 0 !important;
  background: #f5f6f8 !important;
  color: #171717;
}

#login.box {
  max-width: 420px;
  margin: 9vh auto;
  padding: 32px;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  box-shadow: 0 12px 40px #0000000a;
}

#panel.box {
  max-width: 1500px;
  margin: 0 auto;
  padding: 0;
  background: #f5f6f8;
  border-radius: 0;
  box-shadow: none;
  min-height: 100vh;
}

.gy-header {
  min-height: 76px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 16px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.gy-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 17px;
  font-weight: 800;
}

.gy-logo {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #111;
  color: #fff;
  font-weight: 900;
}

.gy-layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  direction: rtl;
  min-height: calc(100vh - 76px);
}

.gy-sidebar {
  background: #fff;
  border-left: 1px solid #e5e7eb;
  padding: 20px 12px;
}

.gy-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 5px 0 !important;
  padding: 13px !important;
  text-align: right;
  background: transparent !important;
  color: #52525b !important;
  border: 1px solid transparent !important;
  border-radius: 10px !important;
}

.gy-nav:hover {
  background: #f4f4f5 !important;
}

.gy-nav.active {
  background: #111 !important;
  color: white !important;
}

.gy-main {
  min-width: 0;
  padding: 26px;
}

.gy-heading {
  margin: 0 0 22px;
}

.gy-heading h1 {
  font-size: 26px;
  margin: 0 0 8px;
}

.gy-heading p {
  color: #71717a;
  line-height: 1.7;
  margin: 0;
}

.gy-page {
  display: none;
}

.gy-page.active {
  display: block;
  animation: gyShow .18s ease;
}

@keyframes gyShow {
  from { opacity: .5; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

.gy-page > .section {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 24px;
  margin: 0 !important;
}

.gy-page h2 {
  margin-top: 0 !important;
  font-size: 19px;
  border-bottom-color: #eee;
}

#panel input,
#panel textarea,
#panel select {
  border-color: #e4e4e7;
  background: #fff;
}

#panel input:focus,
#panel textarea:focus,
#panel select:focus {
  outline: 2px solid #e4e4e7;
}

#panel button {
  transition: background .15s ease;
}

.gy-shortcuts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 20px;
}

.gy-shortcuts button {
  min-height: 105px;
  padding: 18px !important;
  background: white !important;
  color: #18181b !important;
  border: 1px solid #e5e7eb !important;
  text-align: right;
  line-height: 1.8;
}

.gy-shortcuts button:hover {
  background: #f8f8f8 !important;
}

.gy-shortcuts small {
  display: block;
  color: #71717a;
}

#panel .chat-head {
  background: #171717;
}

#panel .visitor-item.active,
#panel .visitor-item:hover {
  background: #f4f4f5;
}

#panel .unread-dot {
  background: #171717;
}

#panel .send-chat {
  background: #171717;
}

@media(max-width:760px) {
  #login.box {
    margin: 30px 12px;
    padding: 22px;
  }

  #panel.box {
    margin: 0;
  }

  .gy-header {
    padding: 13px;
  }

  .gy-layout {
    display: block;
  }

  .gy-sidebar {
    display: none;
    border-bottom: 1px solid #e5e7eb;
    padding: 10px;
  }

  .gy-sidebar.open {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .gy-nav {
    font-size: 13px;
    padding: 10px !important;
  }

  .gy-main {
    padding: 14px;
  }

  .gy-page > .section {
    padding: 16px;
  }

  .gy-heading h1 {
    font-size: 22px;
  }

  #panel .chat-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
</style>

<script>
(() => {
  function setupGYAdmin() {
    const panel = document.getElementById('panel');
    if (!panel || panel.dataset.gyNavigationReady) return;

    const sections = [
      {
        id: 'settings',
        title: 'بيانات الموقع',
        element: panel.querySelector('.section:has(#siteName)')
      },
      {
        id: 'categories',
        title: 'المجموعات',
        element: panel.querySelector('.section:has(#categoryName)')
      },
      {
        id: 'add',
        title: 'إضافة تصميم',
        element: panel.querySelector('.section:has(#addBtn)')
      },
      {
        id: 'designs',
        title: 'التصميمات الحالية',
        element: panel.querySelector('.section:has(#list)')
      },
      {
        id: 'chat',
        title: 'المحادثات',
        element: document.getElementById('chatSection')
      }
    ];

    if (sections.some(section => !section.element)) return;

    panel.dataset.gyNavigationReady = '1';

    const oldTitle = panel.querySelector(':scope > h1');
    const oldIntro = panel.querySelector(':scope > p');

    const header = document.createElement('header');
    header.className = 'gy-header';
    header.innerHTML = `
      <div class="gy-brand">
        <span class="gy-logo">GY.</span>
        <span>GalalM7<small style="display:block;color:#71717a;font-size:11px;margin-top:3px">ADMIN DASHBOARD</small></span>
      </div>
      <button type="button" id="gyMenuToggle">☰ القائمة</button>
    `;

    const layout = document.createElement('div');
    layout.className = 'gy-layout';

    const sidebar = document.createElement('nav');
    sidebar.className = 'gy-sidebar';

    const main = document.createElement('main');
    main.className = 'gy-main';

    const heading = document.createElement('div');
    heading.className = 'gy-heading';
    heading.innerHTML = `
      <h1 id="gyCurrentTitle">الرئيسية</h1>
      <p id="gyCurrentDescription">إدارة موقعك وتصميماتك من مكان واحد.</p>
    `;
    main.appendChild(heading);

    const overview = document.createElement('section');
    overview.className = 'gy-page active';
    overview.dataset.page = 'home';
    overview.innerHTML = `
      <div class="section">
        <h2>أهلاً بيك في لوحة التحكم</h2>
        <p class="hint">اختار القسم اللي عايز تديره.</p>
        <div class="gy-shortcuts">
          <button type="button" data-open-page="settings">⚙️ بيانات الموقع<small>البيانات وصورة البروفايل</small></button>
          <button type="button" data-open-page="categories">📁 المجموعات<small>تنظيم التصنيفات</small></button>
          <button type="button" data-open-page="add">＋ إضافة تصميم<small>رفع عمل جديد</small></button>
          <button type="button" data-open-page="designs">▧ التصميمات الحالية<small>عرض أعمالك وإدارتها</small></button>
          <button type="button" data-open-page="chat">💬 المحادثات<small>رسائل الزوار والردود</small></button>
        </div>
      </div>
    `;
    main.appendChild(overview);

    const descriptions = {
      home: 'إدارة موقعك وتصميماتك من مكان واحد.',
      settings: 'تعديل بيانات الموقع وصورة البروفايل ووسائل التواصل.',
      categories: 'إضافة المجموعات وتنظيم التصميمات.',
      add: 'رفع تصميم جديد مع ضغط الصورة تلقائيًا.',
      designs: 'عرض التصميمات الموجودة وإدارتها.',
      chat: 'متابعة رسائل الزوار والرد عليهم.'
    };

    const navItems = [
      ['home', '⌂', 'الرئيسية'],
      ['settings', '⚙', 'بيانات الموقع'],
      ['categories', '▦', 'المجموعات'],
      ['add', '＋', 'إضافة تصميم'],
      ['designs', '▧', 'التصميمات الحالية'],
      ['chat', '✉', 'المحادثات']
    ];

    navItems.forEach(([id, icon, label]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'gy-nav' + (id === 'home' ? ' active' : '');
      button.dataset.openPage = id;
      button.textContent = icon + '  ' + label;
      sidebar.appendChild(button);
    });

    sections.forEach(section => {
      const page = document.createElement('section');
      page.className = 'gy-page';
      page.dataset.page = section.id;
      page.appendChild(section.element);
      main.appendChild(page);
    });

    // Keep the existing functional elements and event handlers.
    // Only move the existing sections into the new layout.
    if (oldTitle) oldTitle.remove();
    if (oldIntro) oldIntro.remove();
    panel.querySelectorAll(':scope > hr').forEach(hr => hr.remove());

    layout.appendChild(sidebar);
    layout.appendChild(main);
    panel.prepend(header);
    panel.appendChild(layout);

    function openPage(id) {
      main.querySelectorAll('.gy-page').forEach(page => {
        page.classList.toggle('active', page.dataset.page === id);
      });

      sidebar.querySelectorAll('.gy-nav').forEach(button => {
        button.classList.toggle('active', button.dataset.openPage === id);
      });

      const label = navItems.find(item => item[0] === id)?.[2] || 'الرئيسية';
      document.getElementById('gyCurrentTitle').textContent = label;
      document.getElementById('gyCurrentDescription').textContent = descriptions[id] || '';
      sidebar.classList.remove('open');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    panel.querySelectorAll('[data-open-page]').forEach(button => {
      button.addEventListener('click', () => openPage(button.dataset.openPage));
    });

    document.getElementById('gyMenuToggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupGYAdmin);
  } else {
    setupGYAdmin();
  }
})();
</script>
