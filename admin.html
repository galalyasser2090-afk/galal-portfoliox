<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Panel | Galal Yasser</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#f5f7ff;
}

header{
  padding:22px 6%;
  background:linear-gradient(135deg,#111a35,#17102b);
  border-bottom:1px solid #2a3152;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  color:#9da7c4;
  margin:8px 0 0;
}

.container{
  width:min(1100px,92%);
  margin:30px auto;
}

.panel{
  background:#121a31;
  border:1px solid #293254;
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
}

.panel h2{
  margin-top:0;
  color:#c9b8ff;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#b8c0d9;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #354064;
  background:#0b1020;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  margin-top:15px;
  cursor:pointer;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
}

button:hover{opacity:.9}

.danger{background:#dc3545}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.success{
  background:#123d2b;
  color:#7df0b0;
}

.error{
  background:#431b24;
  color:#ff9eaa;
}

.item{
  background:#0b1020;
  border:1px solid #293254;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
}

.item-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.item-title{
  font-weight:bold;
}

.small{
  color:#8993b0;
  font-size:13px;
  margin-top:5px;
  word-break:break-all;
}

.preview{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
  border:1px solid #293254;
}

@media(max-width:600px){
  .item-row{
    flex-direction:column;
    align-items:stretch;
  }
}
</style>
</head>

<body>

<header>
  <h1>لوحة تحكم Galal Yasser</h1>
  <p>إدارة المجموعات والتصميمات وبيانات التواصل</p>
</header>

<div class="container">

<!-- بيانات الموقع -->

<section class="panel">

<h2>⚙️ بيانات الموقع</h2>

<label>اسم الموقع</label>
<input id="site_name" type="text">

<label>العنوان الرئيسي</label>
<input id="headline" type="text">

<label>الوصف</label>
<textarea id="description"></textarea>

<label>رقم الهاتف</label>
<input id="phone" type="text">

<label>رقم واتساب</label>
<input id="whatsapp" type="text">

<label>Vodafone Cash</label>
<input id="vodafone_cash" type="text">

<button id="saveSettings">💾 حفظ بيانات الموقع</button>

<div id="settingsMessage" class="message"></div>

</section>


<!-- المجموعات -->

<section class="panel">

<h2>📁 المجموعات</h2>

<input
  id="categoryName"
  type="text"
  placeholder="مثال: تصميمات مدرسين"
>

<button id="addCategory">➕ إضافة مجموعة</button>

<div id="categoriesList"></div>

<div id="categoryMessage" class="message"></div>

</section>


<!-- إضافة تصميم -->

<section class="panel">

<h2>🖼️ إضافة تصميم</h2>

<label>اسم التصميم</label>

<input
  id="designTitle"
  type="text"
  placeholder="اسم التصميم"
>


<label>الصورة</label>

<input
  id="imageFile"
  type="file"
  accept="image/*"
>

<div id="fileName" class="small">
لم يتم اختيار صورة
</div>


<label>المجموعة</label>

<select id="categorySelect">
  <option value="">اختر المجموعة</option>
</select>


<button id="addDesign">
➕ رفع وإضافة التصميم
</button>

<div id="designMessage" class="message"></div>

</section>


<!-- التصميمات -->

<section class="panel">

<h2>🎨 التصميمات الموجودة</h2>

<div id="designsList"></div>

</section>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://nsppbvbvdxuquqgkioxf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* الرسائل */

function showMessage(element,text,success=true){

  element.textContent=text;

  element.className =
    "message " +
    (success ? "success" : "error");

  element.style.display="block";

  setTimeout(()=>{
    element.style.display="none";
  },4000);
}


/* =========================
   بيانات الموقع
========================= */

async function loadSettings(){

  const {data,error} =
    await supabase
      .from("site_settings")
      .select(
        "id,site_name,headline,description,phone,whatsapp,vodafone_cash"
      )
      .limit(1)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data) return;

  document.getElementById("site_name").value =
    data.site_name || "";

  document.getElementById("headline").value =
    data.headline || "";

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("phone").value =
    data.phone || "";

  document.getElementById("whatsapp").value =
    data.whatsapp || "";

  document.getElementById("vodafone_cash").value =
    data.vodafone_cash || "";
}


document
.getElementById("saveSettings")
.addEventListener("click",async()=>{

  const message =
    document.getElementById("settingsMessage");

  const values = {

    site_name:
      document.getElementById("site_name").value.trim(),

    headline:
      document.getElementById("headline").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    phone:
      document.getElementById("phone").value.trim(),

    whatsapp:
      document.getElementById("whatsapp").value.trim(),

    vodafone_cash:
      document.getElementById("vodafone_cash").value.trim()

  };


  const {data:existing,error:findError} =
    await supabase
      .from("site_settings")
      .select("id")
      .limit(1)
      .maybeSingle();


  if(findError){

    console.error(findError);

    showMessage(
      message,
      "تعذر قراءة بيانات الموقع",
      false
    );

    return;
  }


  let result;


  if(existing){

    result =
      await supabase
        .from("site_settings")
        .update(values)
        .eq("id",existing.id);

  }else{

    result =
      await supabase
        .from("site_settings")
        .insert(values);

  }


  if(result.error){

    console.error(result.error);

    showMessage(
      message,
      "تعذر حفظ بيانات الموقع",
      false
    );

    return;
  }


  showMessage(
    message,
    "تم حفظ بيانات الموقع بنجاح ✅",
    true
  );

});


/* =========================
   المجموعات
========================= */

async function loadCategories(){

  const list =
    document.getElementById("categoriesList");

  const select =
    document.getElementById("categorySelect");


  list.innerHTML="";

  select.innerHTML =
    '<option value="">اختر المجموعة</option>';


  const {data,error} =
    await supabase
      .from("categories")
      .select("id,name")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    console.error(error);

    list.innerHTML =
      "<p>حدث خطأ في تحميل المجموعات.</p>";

    return;
  }


  data.forEach(category=>{

    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <div class="item-row">

        <div class="item-title">
          ${escapeHTML(category.name)}
        </div>

        <button
          class="danger"
          data-id="${category.id}"
        >
          حذف
        </button>

      </div>
    `;


    div
      .querySelector("button")
      .addEventListener(
        "click",
        ()=>{
          deleteCategory(category.id);
        }
      );


    list.appendChild(div);


    const option =
      document.createElement("option");

    option.value =
      category.id;

    option.textContent =
      category.name;

    select.appendChild(option);

  });

}


document
.getElementById("addCategory")
.addEventListener("click",async()=>{

  const input =
    document.getElementById("categoryName");

  const message =
    document.getElementById("categoryMessage");


  const name =
    input.value.trim();


  if(!name){

    showMessage(
      message,
      "اكتب اسم المجموعة أولاً",
      false
    );

    return;
  }


  const {error} =
    await supabase
      .from("categories")
      .insert({
        name:name
      });


  if(error){

    console.error(error);

    showMessage(
      message,
      "تعذر إضافة المجموعة",
      false
    );

    return;
  }


  input.value="";


  showMessage(
    message,
    "تمت إضافة المجموعة ✅",
    true
  );


  loadCategories();

});


async function deleteCategory(id){

  if(!confirm("هل تريد حذف هذه المجموعة؟")){
    return;
  }


  const {error} =
    await supabase
      .from("categories")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "تعذر حذف المجموعة. قد تكون مرتبطة بتصميمات."
    );

    return;
  }


  loadCategories();
  loadDesigns();

}


/* =========================
   اختيار الصورة
========================= */

document
.getElementById("imageFile")
.addEventListener("change",function(){

  const file =
    this.files[0];

  const name =
    document.getElementById("fileName");


  if(file){

    name.textContent =
      "الصورة المختارة: " + file.name;

  }else{

    name.textContent =
      "لم يتم اختيار صورة";

  }

});


/* =========================
   رفع الصورة
========================= */

async function uploadImage(file){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    crypto.randomUUID() +
    "." +
    extension;


  const filePath =
    fileName;


  const {error} =
    await supabase
      .storage
      .from("designs")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    console.error(error);

    throw error;
  }


  const {data} =
    supabase
      .storage
      .from("designs")
      .getPublicUrl(filePath);


  return data.publicUrl;
}


/* =========================
   إضافة التصميم
========================= */

document
.getElementById("addDesign")
.addEventListener("click",async()=>{

  const title =
    document
      .getElementById("designTitle")
      .value
      .trim();


  const file =
    document
      .getElementById("imageFile")
      .files[0];


  const category_id =
    document
      .getElementById("categorySelect")
      .value;


  const message =
    document.getElementById("designMessage");


  if(!title){

    showMessage(
      message,
      "اكتب اسم التصميم أولاً",
      false
    );

    return;
  }


  if(!file){

    showMessage(
      message,
      "اختار صورة من الجهاز أولاً",
      false
    );

    return;
  }


  if(file.size > 10 * 1024 * 1024){

    showMessage(
      message,
      "حجم الصورة يجب أن يكون أقل من 10 ميجابايت",
      false
    );

    return;
  }


  try{

    showMessage(
      message,
      "جاري رفع الصورة...",
      true
    );


    const image_url =
      await uploadImage(file);


    const {error} =
      await supabase
        .from("designs")
        .insert({

          title:title,

          image_url:image_url,

          category_id:
            category_id || null

        });


    if(error){

      console.error(error);

      showMessage(
        message,
        "تم رفع الصورة لكن تعذر حفظ التصميم",
        false
      );

      return;
    }


    document.getElementById(
      "designTitle"
    ).value="";


    document.getElementById(
      "imageFile"
    ).value="";


    document.getElementById(
      "fileName"
    ).textContent =
      "لم يتم اختيار صورة";


    document.getElementById(
      "categorySelect"
    ).value="";


    showMessage(
      message,
      "تم رفع وإضافة التصميم بنجاح ✅",
      true
    );


    loadDesigns();

  }catch(error){

    console.error(error);

    showMessage(
      message,
      "تعذر رفع الصورة. سنحتاج لضبط صلاحيات Storage.",
      false
    );

  }

});


/* =========================
   التصميمات
========================= */

async function loadDesigns(){

  const list =
    document.getElementById("designsList");


  list.innerHTML =
    "<p>جاري التحميل...</p>";


  const {data,error} =
    await supabase
      .from("designs")
      .select(
        "id,title,image_url,category_id"
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    console.error(error);

    list.innerHTML =
      "<p>حدث خطأ في تحميل التصميمات.</p>";

    return;
  }


  if(!data || data.length===0){

    list.innerHTML =
      "<p>لا توجد تصميمات.</p>";

    return;
  }


  list.innerHTML="";


  data.forEach(design=>{

    const div =
      document.createElement("div");

    div.className="item";


    div.innerHTML=`

      <div class="item-row">

        <div>

          <div class="item-title">
            ${escapeHTML(
              design.title || "بدون اسم"
            )}
          </div>

          <img
            class="preview"
            src="${escapeHTML(design.image_url)}"
            alt=""
          >

          <div class="small">
            ${escapeHTML(design.image_url)}
          </div>

        </div>

        <button
          class="danger"
          data-id="${design.id}"
        >
          حذف
        </button>

      </div>

    `;


    div
      .querySelector("button")
      .addEventListener(
        "click",
        ()=>{
          deleteDesign(design.id);
        }
      );


    list.appendChild(div);

  });

}


async function deleteDesign(id){

  if(!confirm("هل تريد حذف هذا التصميم؟")){
    return;
  }


  const {error} =
    await supabase
      .from("designs")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "تعذر حذف التصميم."
    );

    return;
  }


  loadDesigns();

}


/* =========================
   حماية عرض النصوص
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[char])
    );

}


/* =========================
   تشغيل
========================= */

loadSettings();
loadCategories();
loadDesigns();

</script>

</body>
</html>
