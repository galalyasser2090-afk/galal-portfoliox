<script>

  // =========================

  const SUPABASE_KEY =
    "sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // رسالة

  function showMessage(id, text, success = true) {

    const element = document.getElementById(id);

  // =========================

  document

  // =========================
  // تحويل الحجم
  // =========================

  function formatBytes(bytes) {

    if (bytes === 0) return "0 Bytes";

    const sizes = [
      "Bytes",
      "KB",
      "MB",
      "GB"
    ];

    const i =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (bytes / Math.pow(1024, i))
          .toFixed(2)
      ) +
      " " +
      sizes[i]
    );

  }


  // =========================
  // ضغط الصورة
  // =========================

  function compressImage(
    file,
    maxWidth = 2000,
    maxHeight = 2000,
    quality = 0.82
  ) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload = function (event) {

          const img =
            new Image();

          img.onload = function () {

            let width =
              img.width;

            let height =
              img.height;


            // تصغير الأبعاد إذا كانت كبيرة

            if (
              width > maxWidth ||
              height > maxHeight
            ) {

              const ratio =
                Math.min(
                  maxWidth / width,
                  maxHeight / height
                );

              width =
                Math.round(
                  width * ratio
                );

              height =
                Math.round(
                  height * ratio
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function (blob) {

                if (!blob) {

                  reject(
                    new Error(
                      "فشل ضغط الصورة"
                    )
                  );

                  return;

                }


                const compressedFile =
                  new File(
                    [blob],
                    file.name
                      .replace(
                        /\.[^/.]+$/,
                        ""
                      ) +
                      ".jpg",
                    {
                      type:
                        "image/jpeg",
                      lastModified:
                        Date.now()
                    }
                  );


                resolve(
                  compressedFile
                );

              },
              "image/jpeg",
              quality
            );

          };


          img.onerror =
            function () {

              reject(
                new Error(
                  "تعذر قراءة الصورة"
                )
              );

            };


          img.src =
            event.target.result;

        };


        reader.onerror =
          function () {

            reject(
              new Error(
                "تعذر قراءة الملف"
              )
            );

          };


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  // =========================
  // رفع الصورة
  // =========================

  async function uploadImage(file) {

    // ضغط الصورة أولًا

    const compressed =
      await compressImage(
        file
      );


    console.log(
      "الحجم الأصلي:",
      formatBytes(file.size)
    );

    console.log(
      "الحجم بعد الضغط:",
      formatBytes(
        compressed.size
      )
    );


    const fileName =
      crypto.randomUUID() +
      ".jpg";


    const filePath =
      fileName;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from("designs")
        .upload(
          filePath,
          compressed,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              "image/jpeg"
          }
        );


    if (error) {

      throw error;

    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from("designs")
        .getPublicUrl(
          filePath
        );


    return data.publicUrl;

  }


  // =========================
  // تحميل إعدادات الموقع
  // =========================

  async function loadSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("site_settings")
        .select("*")
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(error);

      return;

    }


    if (!data) return;


    document.getElementById(
      "siteName"
    ).value =
      data.site_name || "";


    document.getElementById(
      "headline"
    ).value =
      data.headline || "";


    document.getElementById(
      "description"
    ).value =
      data.description || "";


    document.getElementById(
      "phone"
    ).value =
      data.phone || "";


    document.getElementById(
      "whatsapp"
    ).value =
      data.whatsapp || "";


    document.getElementById(
      "vodafoneCash"
    ).value =
      data.vodafone_cash || "";

  }


  // =========================
  // حفظ إعدادات الموقع
  // =========================

  async function saveSettings() {

    const {
      data: existing
    } =
      await supabaseClient
        .from("site_settings")
        .select("id")
        .limit(1)
        .maybeSingle();


    const settings = {

      site_name:
        document.getElementById(
          "siteName"
        ).value.trim(),

      headline:
        document.getElementById(
          "headline"
        ).value.trim(),

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      phone:
        document.getElementById(
          "phone"
        ).value.trim(),

      whatsapp:
        document.getElementById(
          "whatsapp"
        ).value.trim(),

      vodafone_cash:
        document.getElementById(
          "vodafoneCash"
        ).value.trim()

    };


    let result;


    if (existing) {

      result =
        await supabaseClient
          .from("site_settings")
          .update(settings)
          .eq(
            "id",
            existing.id
          );

    } else {

      result =
        await supabaseClient
          .from("site_settings")
          .insert(
            [settings]
          );

    }


    if (result.error) {

      showMessage(
        "settingsMessage",
        "حدث خطأ أثناء حفظ الإعدادات",
        false
      );

      console.error(
        result.error
      );

      return;

    }


    showMessage(
      "settingsMessage",
      "تم حفظ إعدادات الموقع بنجاح"
    );

  }


  // =========================
  // تحميل المجموعات
  // =========================

  async function loadCategories() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("categories")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      return;

    }


    const list =
      document.getElementById(
        "categoriesList"
      );


    const select =
      document.getElementById(
        "designCategory"
      );


    list.innerHTML = "";

    select.innerHTML =
      '<option value="">اختر المجموعة</option>';


    data.forEach(
      category => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "category-item";


        item.innerHTML = `

          <span>
            ${escapeHTML(

          <button

            onclick="deleteCategory('${category.id}')"

            حذف
          </button>

        `;


        list.appendChild(

        );


        const option =
          document.createElement(
            "option"
          );

        option.value =
          category.id;

        option.textContent =
          category.name;

        select.appendChild(
          option
        );

      }
    );

  }


  // =========================
  // إضافة مجموعة

  async function addCategory() {

    const name =
      document.getElementById(
        "categoryName"
      ).value.trim();


    if (!name) {

      showMessage(
        "categoryMessage",
        "اكتب اسم المجموعة أولًا",
        false
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("categories")
        .insert([
          {
            name: name
          }
        ]);


    if (error) {

      console.error(error);

      showMessage(
        "categoryMessage",
        "تعذر إضافة المجموعة",
        false
      );

      return;

    }


    document.getElementById(
      "categoryName"
    ).value = "";


    showMessage(
      "categoryMessage",
      "تمت إضافة المجموعة بنجاح"
    );


    loadCategories();

  }


  // =========================
  // حذف مجموعة

  async function deleteCategory(id) {

    if (
      !confirm(
        "هل أنت متأكد من حذف المجموعة؟"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("categories")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "تعذر حذف المجموعة"
      );

      console.error(error);

      return;

    }


    loadCategories();

    loadDesigns();

  }


  // =========================
  // إضافة تصميم
  // =========================

  async function addDesign() {

    const title =
      document.getElementById(
        "designTitle"
      ).value.trim();


    const categoryId =
      document.getElementById(
        "designCategory"
      ).value;


    const file =
      document.getElementById(
        "imageFile"
      ).files[0];


    if (!title) {

      showMessage(
        "designMessage",
        "اكتب اسم التصميم",
        false
      );

      return;

    }


    if (!categoryId) {

      showMessage(
        "designMessage",
        "اختر المجموعة",
        false
      );

      return;

    }


    if (!file) {

      showMessage(
        "designMessage",
        "اختر صورة من الجهاز",
        false
      );

      return;

    }


    try {

      showMessage(
        "designMessage",
        "جاري ضغط الصورة ورفعها..."
      );


      // رفع الصورة بعد الضغط

      const imageUrl =
        await uploadImage(

        );


      // إضافة التصميم إلى قاعدة البيانات

      const {
        error
      } =
        await supabaseClient
          .from("designs")
          .insert([
            {
              title:
                title,

              image_url:
                imageUrl,

              category_id:
                categoryId
            }
          ]);


      if (error) {

        throw error;

      }


      document.getElementById(
        "designTitle"
      ).value = "";


      document.getElementById(
        "imageFile"
      ).value = "";


      document.getElementById(
        "fileName"
      ).textContent =
        "لم يتم اختيار صورة";


      showMessage(

        "تمت إضافة التصميم بنجاح ✅"

    catch (error) {

      console.error(error);

      showMessage(
        "designMessage",
        "حدث خطأ أثناء رفع الصورة أو إضافة التصميم",
        false
      );

    }

  }


  // =========================
  // تحميل التصميمات
  // =========================

  async function loadDesigns() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("designs")
        .select(
          `
          *,
          categories (
            name
          )
          `
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      return;

    }


    const list =
      document.getElementById(
        "designsList"
      );


    list.innerHTML = "";


    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>لا توجد تصميمات حتى الآن.</p>";

      return;

    }


    data.forEach(
      design => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "design-item";


        item.innerHTML = `

          <div class="design-info">

            <img
              src="${design.image_url}"
              alt=""
            >

            <div>

              <strong>
                ${escapeHTML(
                  design.title
                )}
              </strong>

              <br>

              <small>
                المجموعة:
                ${
                  design.categories
                    ? escapeHTML(
                        design.categories.name
                      )
                    : "بدون مجموعة"
                }
              </small>

            </div>

          </div>


          <button
            class="danger"
            onclick="deleteDesign('${design.id}')"
          >
            حذف
          </button>

        `;


        list.appendChild(
          item
        );

      }
    );

  }


  // =========================
  // حذف تصميم
  // =========================

  async function deleteDesign(id) {

    if (
      !confirm(
        "هل أنت متأكد من حذف التصميم؟"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("designs")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "تعذر حذف التصميم"
      );

      console.error(error);

      return;

    }


    loadDesigns();

  }


  // =========================
  // حماية النصوص
  // =========================

  function escapeHTML(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================
  // تشغيل الصفحة
  // =========================

  loadSettings();

  loadCategories();

  loadDesigns();

</script>
