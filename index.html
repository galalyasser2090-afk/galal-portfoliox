<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eng. Galal Yasser | Portfolio</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f5f7ff}header{padding:28px 6%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#111a35,#17102b);position:sticky;top:0;z-index:5;border-bottom:1px solid #2a3152}.brand{font-size:24px;font-weight:800}.brand span{color:#8b5cf6}.hero{padding:90px 6%;text-align:center;background:radial-gradient(circle at 50% 20%,#30206a 0,#0b1020 55%)}h1{font-size:clamp(38px,7vw,72px);margin:10px 0}.hero p{color:#b8c0d9;font-size:19px}.tag{display:inline-block;padding:9px 16px;border:1px solid #7048d8;border-radius:999px;color:#c9b8ff;background:#17122c}.works{padding:55px 6%}.works h2{text-align:center;font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:30px}.card{background:#121a31;border:1px solid #293254;border-radius:20px;overflow:hidden;box-shadow:0 15px 35px #0004}.card img{width:100%;height:240px;object-fit:cover;display:block}.card h3{margin:0;padding:18px}.empty-state{text-align:center;color:#8892b0;padding:70px 20px}footer{text-align:center;padding:35px;color:#7f89a8;border-top:1px solid #242c49}@media(max-width:600px){header{padding:20px}.hero{padding:65px 20px}.works{padding:35px 20px}}</style></head><body><header><div class="brand">Eng. <span>Galal Yasser</span></div><div>Portfolio</div></header><section class="hero"><span class="tag">Graphic Designer</span><h1>أهلاً بك في معرض أعمالي</h1><p>مجموعة من تصميماتي وأعمالي الإبداعية</p></section><section class="works"><h2>تصميماتي</h2><div id="grid" class="grid"><div class="empty-state" style="grid-column:1/-1">جاري تحميل التصميمات...</div></div></section><footer>© Eng. Galal Yasser — All Rights Reserved</footer><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://nsppbvbvdxuquqgkioxf.supabase.co','sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv');const g=document.getElementById('grid');function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){const {data,error}=await s.from('designs').select('id,title,image_url').order('created_at',{ascending:false});if(error){console.error(error);g.innerHTML='<div class="empty-state" style="grid-column:1/-1">تعذر تحميل التصميمات. تأكد من إعداد جدول designs وسياسة القراءة في Supabase.</div>';return}if(!data?.length){g.innerHTML='<div class="empty-state" style="grid-column:1/-1">لم تتم إضافة تصميمات بعد.</div>';return}g.innerHTML=data.map(d=>`<article class="card"><img src="${esc(d.image_url)}" alt="${esc(d.title||'Design')}"><h3>${esc(d.title||'Design')}</h3></article>`).join('')}load();</script></body></html>
