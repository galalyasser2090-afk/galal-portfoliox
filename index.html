<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>معرض أعمالي</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #0b0f19;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    header .portfolio {
      color: #aaa;
      font-size: 15px;
    }

    .hero {
      text-align: center;
      padding: 90px 20px 70px;
      background:
        radial-gradient(
          circle at center,
          rgba(124,92,255,0.22),
          transparent 55%
        );
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(124,92,255,0.5);
      color: #b9aaff;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 58px);
      margin-bottom: 18px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.8;
    }

    .works {
      width: 86%;
      max-width: 1400px;
      margin: auto;
      padding: 30px 0 80px;
    }

    .works h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 25px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .category-btn {
      border: 1px solid rgba(124,92,255,0.45);
      background: #121827;
      color: #ddd;
      padding: 11px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #7c5cff;
      color: white;
      border-color: #7c5cff;
    }

    .current-category {
      text-align: center;
      color: #b9aaff;
      font-size: 18px;
      margin: 25px 0;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(280px, 1fr)
      );
      gap: 22px;
    }

    .card {
      background: #111725;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      overflow: hidden;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(124,92,255,0.5);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .card-title {
      padding: 16px;
      text-align: center;
      color: #eee;
      font-size: 16px;
    }

    .empty-state {
      width: 100%;
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 45px 20px;
      text-align: center;
      background: #080c14;
    }

    .contact-title {
      font-size: 22px;
      margin-bottom: 22px;
      font-weight: bold;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .contact-btn {
      text-decoration: none;
      color: white;
      background: #151c2d;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .contact-btn:hover {
      background: #7c5cff;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .close-lightbox {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 38px;
      color: white;
      cursor: pointer;
      z-index: 1001;
    }

    @media (max-width: 600px) {

      header {
        padding: 18px 5%;
      }

      .hero {
        padding-top: 65px;
      }

      .works {
        width: 92%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card img {
        height: auto;
      }

    }
  </style>
</head>

<body>

  <header>

    <div
      class="logo"
      id="siteName">
      Eng. Galal Yasser
    </div>

    <div class="portfolio">
      Portfolio
    </div>

  </header>


  <section class="hero">

    <span class="tag">
      Graphic Designer
    </span>

    <h1 id="headline">
      أهلاً بك في معرض أعمالي
    </h1>

    <p id="description">
      مجموعة من تصميماتي وأعمالي الإبداعية
    </p>

  </section>


  <section class="works">

    <h2>
      تصميماتي
    </h2>


    <div
      id="categories"
      class="categories">

      <div class="empty-state">
        جاري تحميل المجموعات...
      </div>

    </div>


    <div
      id="currentCategory"
      class="current-category">

      كل التصميمات

    </div>


    <div
      id="grid"
      class="grid">

      <div
        class="empty-state"
        style="grid-column:1/-1">

        جاري تحميل التصميمات...

      </div>

    </div>

  </section>


  <footer>

    <div class="contact-title">
      للتواصل والدفع
    </div>

    <div class="contact-buttons">

      <a
        id="phoneBtn"
        href="#"
        class="contact-btn">

        📞 اتصال

      </a>


      <a
        id="whatsappBtn"
        href="#"
        target="_blank"
        rel="noopener"
        class="contact-btn">

        💬 واتساب

      </a>


      <a
        id="vodafoneBtn"
        href="#"
        class="contact-btn">

        💳 Vodafone Cash

      </a>

    </div>

  </footer>


  <div
    id="lightbox"
    class="lightbox">

    <div
      class="close-lightbox"
      onclick="closeLightbox()">

      ×

    </div>

    <img
      id="lightboxImage"
      src=""
      alt="">

  </div>


  <script>

    /*
      ==========================================
      اتصال Supabase
      ==========================================
    */

    const SUPABASE_URL =
      "https://nsppbvbvdxuquqgkioxf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      ==========================================
      متغيرات الموقع
      ==========================================
    */

    let allDesigns = [];
    let allCategories = [];


    /*
      ==========================================
      تحميل إعدادات الموقع
      ==========================================
    */

    async function loadSiteSettings() {

      try {

        const result =
          await db
            .from("site_settings")
            .select(
              "site_name,headline,description,phone,whatsapp,vodafone_cash"
            )
            .limit(1)
            .maybeSingle();


        if (result.error) {

          console.error(
            "Site settings error:",
            result.error
          );

          return;
        }


        const data =
          result.data;


        if (!data) {
          return;
        }


        if (data.site_name) {

          document.getElementById(
            "siteName"
          ).textContent =
            data.site_name;

        }


        if (data.headline) {

          document.getElementById(
            "headline"
          ).textContent =
            data.headline;

        }


        if (data.description) {

          document.getElementById(
            "description"
          ).textContent =
            data.description;

        }


        if (data.phone) {

          const phone =
            String(data.phone)
              .replace(/\s+/g, "");

          document.getElementById(
            "phoneBtn"
          ).href =
            "tel:" + phone;

        }


        if (data.whatsapp) {

          let whatsapp =
            String(data.whatsapp)
              .replace(/\s+/g, "")
              .replace(/^\+/, "");


          if (
            whatsapp.startsWith("0")
          ) {

            whatsapp =
              "20" +
              whatsapp.substring(1);

          }


          document.getElementById(
            "whatsappBtn"
          ).href =
            "https://wa.me/" +
            whatsapp;

        }


        if (data.vodafone_cash) {

          const number =
            String(
              data.vodafone_cash
            );


          document.getElementById(
            "vodafoneBtn"
          ).title =
            "Vodafone Cash: " +
            number;


          document.getElementById(
            "vodafoneBtn"
          ).href =
            "https://wa.me/?text=" +
            encodeURIComponent(
              "Vodafone Cash: " +
              number
            );

        }

      }

      catch (error) {

        console.error(
          "Settings error:",
          error
        );

      }

    }


    /*
      ==========================================
      تحميل المجموعات
      ==========================================
    */

    async function loadCategories() {

      const container =
        document.getElementById(
          "categories"
        );


      try {

        const result =
          await db
            .from("categories")
            .select("id,name")
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (result.error) {

          console.error(
            "Categories error:",
            result.error
          );


          container.innerHTML = `
            <div class="empty-state">
              تعذر تحميل المجموعات
            </div>
          `;

          return;
        }


        allCategories =
          result.data || [];


        let html = `

          <button
            class="category-btn active"
            data-category="all">

            كل التصميمات

          </button>

        `;


        allCategories.forEach(
          function(category) {

            html += `

              <button
                class="category-btn"
                data-category="${category.id}">

                📁 ${escapeHtml(category.name)}

              </button>

            `;

          }
        );


        container.innerHTML =
          html;


        const buttons =
          document.querySelectorAll(
            ".category-btn"
          );


        buttons.forEach(
          function(button) {

            button.addEventListener(
              "click",
              function() {

                buttons.forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


                this.classList.add(
                  "active"
                );


                const categoryId =
                  this.dataset.category;


                if (
                  categoryId === "all"
                ) {

                  document.getElementById(
                    "currentCategory"
                  ).textContent =
                    "كل التصميمات";


                  renderDesigns(
                    allDesigns
                  );


                  return;
                }


                const category =
                  allCategories.find(
                    function(item) {

                      return String(
                        item.id
                      ) ===
                      String(
                        categoryId
                      );

                    }
                  );


                document.getElementById(
                  "currentCategory"
                ).textContent =
                  category
                    ? category.name
                    : "المجموعة";


                const filtered =
                  allDesigns.filter(
                    function(design) {

                      return String(
                        design.category_id
                      ) ===
                      String(
                        categoryId
                      );

                    }
                  );


                renderDesigns(
                  filtered
                );

              }
            );

          }
        );

      }

      catch (error) {

        console.error(
          "Categories error:",
          error
        );

      }

    }


    /*
      ==========================================
      تحميل التصميمات
      ==========================================
    */

    async function loadDesigns() {

      const grid =
        document.getElementById(
          "grid"
        );


      try {

        const result =
          await db
            .from("designs")
            .select(
              "id,title,image_url,category_id"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (result.error) {

          console.error(
            "Designs error:",
            result.error
          );


          grid.innerHTML = `

            <div
              class="empty-state"
              style="grid-column:1/-1">

              تعذر تحميل التصميمات

            </div>

          `;

          return;
        }


        allDesigns =
          result.data || [];


        renderDesigns(
          allDesigns
        );

      }

      catch (error) {

        console.error(
          "Designs error:",
          error
        );

      }

    }


    /*
      ==========================================
      عرض التصميمات
      ==========================================
    */

    function renderDesigns(
      designs
    ) {

      const grid =
        document.getElementById(
          "grid"
        );


      if (
        !designs ||
        designs.length === 0
      ) {

        grid.innerHTML = `

          <div
            class="empty-state"
            style="grid-column:1/-1">

            لا توجد تصميمات في هذه المجموعة

          </div>

        `;

        return;
      }


      grid.innerHTML =
        designs
          .map(
            function(design) {

              const image =
                escapeHtml(
                  design.image_url
                );


              const title =
                escapeHtml(
                  design.title ||
                  "تصميم بدون اسم"
                );


              return `

                <div class="card">

                  <img
                    src="${image}"
                    alt="${title}"
                    loading="lazy"
                    onclick="openLightbox('${image}')">

                  <div class="card-title">

                    ${title}

                  </div>

                </div>

              `;

            }
          )
          .join("");

    }


    /*
      ==========================================
      حماية النصوص
      ==========================================
    */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
      ==========================================
      فتح الصورة
      ==========================================
    */

    function openLightbox(
      imageUrl
    ) {

      document.getElementById(
        "lightboxImage"
      ).src =
        imageUrl;


      document.getElementById(
        "lightbox"
      ).classList.add(
        "show"
      );

    }


    /*
      ==========================================
      غلق الصورة
      ==========================================
    */

    function closeLightbox() {

      document.getElementById(
        "lightbox"
      ).classList.remove(
        "show"
      );

    }


    /*
      ==========================================
      غلق عند الضغط خارج الصورة
      ==========================================
    */

    document.getElementById(
      "lightbox"
    ).addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          this
        ) {

          closeLightbox();

        }

      }
    );


    /*
      ==========================================
      تشغيل الموقع
      ==========================================
    */

    async function init() {

      await loadSiteSettings();

      await loadCategories();

      await loadDesigns();

    }


    init();

  </script>

</body>

</html>
