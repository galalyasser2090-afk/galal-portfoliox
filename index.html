<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>معرض أعمالي</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0b0f19;
      color: #fff;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: #0b0f19;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .logo span {
      color: #7c5cff;
    }

    header div:last-child {
      color: #aaa;
      font-size: 15px;
    }

    .hero {
      text-align: center;
      padding: 90px 20px 65px;
      background:
        radial-gradient(circle at center, rgba(124,92,255,.20), transparent 55%);
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(124,92,255,.5);
      border-radius: 30px;
      color: #b9aaff;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 58px);
      margin-bottom: 18px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.8;
    }

    .works {
      width: 86%;
      max-width: 1400px;
      margin: auto;
      padding: 30px 0 80px;
    }

    .works h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 25px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .category-btn {
      border: 1px solid rgba(124,92,255,.45);
      background: #121827;
      color: #ddd;
      padding: 11px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: .2s;
      font-size: 15px;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #7c5cff;
      color: white;
      border-color: #7c5cff;
    }

    .current-category {
      text-align: center;
      color: #b9aaff;
      font-size: 18px;
      margin: 25px 0;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      background: #111725;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      overflow: hidden;
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(124,92,255,.5);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .card-title {
      padding: 16px;
      text-align: center;
      color: #eee;
      font-size: 16px;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 40px 10px;
      width: 100%;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 45px 20px;
      text-align: center;
      background: #080c14;
    }

    .contact-title {
      font-size: 22px;
      margin-bottom: 22px;
      font-weight: bold;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .contact-btn {
      text-decoration: none;
      color: white;
      background: #151c2d;
      border: 1px solid rgba(255,255,255,.1);
      padding: 12px 20px;
      border-radius: 12px;
      transition: .2s;
    }

    .contact-btn:hover {
      background: #7c5cff;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .close-lightbox {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 35px;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      .hero {
        padding-top: 65px;
      }

      .works {
        width: 92%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card img {
        height: auto;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo" id="siteName">
    Eng. <span>Galal Yasser</span>
  </div>

  <div>
    Portfolio
  </div>

</header>


<section class="hero">

  <span class="tag">
    Graphic Designer
  </span>

  <h1 id="headline">
    أهلاً بك في معرض أعمالي
  </h1>

  <p id="description">
    مجموعة من تصميماتي وأعمالي الإبداعية
  </p>

</section>


<section class="works">

  <h2>
    تصميماتي
  </h2>

  <!-- المجموعات -->

  <div
    id="categories"
    class="categories">

    <div class="empty-state">
      جاري تحميل المجموعات...
    </div>

  </div>


  <!-- اسم المجموعة الحالية -->

  <div
    id="currentCategory"
    class="current-category">

    كل التصميمات

  </div>


  <!-- التصميمات -->

  <div
    id="grid"
    class="grid">

    <div
      class="empty-state"
      style="grid-column:1/-1">

      جاري تحميل التصميمات...

    </div>

  </div>

</section>


<footer>

  <div class="contact-title">
    للتواصل والدفع
  </div>

  <div class="contact-buttons">

    <a
      id="phoneBtn"
      href="#"
      class="contact-btn">
      📞 اتصال
    </a>

    <a
      id="whatsappBtn"
      href="#"
      target="_blank"
      rel="noopener"
      class="contact-btn">
      💬 واتساب
    </a>

    <a
      id="vodafoneBtn"
      href="#"
      class="contact-btn">
      💳 Vodafone Cash
    </a>

  </div>

</footer>


<!-- عرض الصورة بالحجم الكبير -->

<div
  id="lightbox"
  class="lightbox">

  <div
    class="close-lightbox"
    onclick="closeLightbox()">
    ×
  </div>

  <img
    id="lightboxImage"
    src=""
    alt="">

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://nsppbvbvdxuquqgkioxf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv";

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let allDesigns = [];
  let allCategories = [];


  /* =========================
     حماية النصوص
  ========================= */

  function esc(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     تحميل بيانات الموقع
  ========================= */

  async function loadSiteSettings() {

    const { data, error } =
      await supabase
        .from("site_settings")
        .select(
          "site_name,headline,description,phone,whatsapp,vodafone_cash"
        )
        .limit(1)
        .maybeSingle();

    if (error) {

      console.error(
        "Site settings error:",
        error
      );

      return;

    }

    if (!data) {
      return;
    }


    /* اسم الموقع */

    if (data.site_name) {

      document.getElementById(
        "siteName"
      ).innerHTML = esc(
        data.site_name
      );

    }


    /* العنوان */

    if (data.headline) {

      document.getElementById(
        "headline"
      ).textContent =
        data.headline;

    }


    /* الوصف */

    if (data.description) {

      document.getElementById(
        "description"
      ).textContent =
        data.description;

    }


    /* رقم الهاتف */

    if (data.phone) {

      const phone =
        String(data.phone)
          .replace(/\s+/g, "")
          .replace(/^00/, "");

      document.getElementById(
        "phoneBtn"
      ).href =
        "tel:" + phone;

    }


    /* واتساب */

    if (data.whatsapp) {

      let whatsapp =
        String(data.whatsapp)
          .replace(/\s+/g, "")
          .replace(/^00/, "");

      if (
        whatsapp.startsWith("0")
      ) {

        whatsapp =
          "20" +
          whatsapp.substring(1);

      }

      if (
        !whatsapp.startsWith("+")
      ) {

        whatsapp =
          whatsapp.replace(
            /^\+/,
            ""
          );

      }

      document.getElementById(
        "whatsappBtn"
      ).href =
        "https://wa.me/" +
        whatsapp;

    }


    /* Vodafone Cash */

    if (data.vodafone_cash) {

      const vodafone =
        encodeURIComponent(
          data.vodafone_cash
        );

      document.getElementById(
        "vodafoneBtn"
      ).href =
        "https://wa.me/?text=" +
        encodeURIComponent(
          "Vodafone Cash: " +
          data.vodafone_cash
        );

      document.getElementById(
        "vodafoneBtn"
      ).title =
        "Vodafone Cash: " +
        data.vodafone_cash;

    }

  }


  /* =========================
     تحميل المجموعات
  ========================= */

  async function loadCategories() {

    const container =
      document.getElementById(
        "categories"
      );

    const {
      data,
      error
    } = await supabase
      .from("categories")
      .select("id,name")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


    if (error) {

      console.error(
        "Categories error:",
        error
      );

      container.innerHTML = `
        <div class="empty-state">
          تعذر تحميل المجموعات
        </div>
      `;

      return;

    }


    allCategories =
      data || [];


    let html = `

      <button
        class="category-btn active"
        data-category="all">

        كل التصميمات

      </button>

    `;


    html += allCategories
      .map(category => {

        return `

          <button
            class="category-btn"
            data-category="${esc(category.id)}">

            📁 ${esc(category.name)}

          </button>

        `;

      })
      .join("");


    container.innerHTML =
      html;


    document
      .querySelectorAll(
        ".category-btn"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".category-btn"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            this.classList.add(
              "active"
            );


            const categoryId =
              this.dataset.category;


            if (
              categoryId === "all"
            ) {

              document.getElementById(
                "currentCategory"
              ).textContent =
                "كل التصميمات";

              renderDesigns(
                allDesigns
              );

              return;

            }


            const category =
              allCategories.find(
                item =>
                  String(item.id) ===
                  String(categoryId)
              );


            document.getElementById(
              "currentCategory"
            ).textContent =
              category
                ? category.name
                : "المجموعة";


            const filtered =
              allDesigns.filter(
                design =>
                  String(
                    design.category_id
                  ) ===
                  String(categoryId)
              );


            renderDesigns(
              filtered
            );

          }
        );

      });

  }


  /* =========================
     تحميل التصميمات
  ========================= */

  async function loadDesigns() {

    const {
      data,
      error
    } = await supabase
      .from("designs")
      .select(
        "id,title,image_url,category_id"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "Designs error:",
        error
      );

      document.getElementById(
        "grid"
      ).innerHTML = `

        <div
          class="empty-state"
          style="grid-column:1/-1">

          تعذر تحميل التصميمات

        </div>

      `;

      return;

    }


    allDesigns =
      data || [];


    renderDesigns(
      allDesigns
    );

  }


  /* =========================
     عرض التصميمات
  ========================= */

  function renderDesigns(
    designs
  ) {

    const grid =
      document.getElementById(
        "grid"
      );


    if (
      !designs ||
      designs.length === 0
    ) {

      grid.innerHTML = `

        <div
          class="empty-state"
          style="grid-column:1/-1">

          لا توجد تصميمات في هذه المجموعة

        </div>

      `;

      return;

    }


    grid.innerHTML =
      designs
        .map(design => {

          return `

            <div class="card">

              <img
                src="${esc(design.image_url)}"
                alt="${esc(design.title || "تصميم")}"
                loading="lazy"
                onclick="openLightbox('${esc(design.image_url)}')">

              <div class="card-title">

                ${esc(
                  design.title ||
                  "تصميم بدون اسم"
                )}

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* =========================
     فتح الصورة
  ========================= */

  function openLightbox(
    imageUrl
  ) {

    document.getElementById(
      "lightboxImage"
    ).src =
      imageUrl;

    document.getElementById(
      "lightbox"
    ).classList.add(
      "show"
    );

  }


  /* =========================
     غلق الصورة
  ========================= */

  function closeLightbox() {

    document.getElementById(
      "lightbox"
    ).classList.remove(
      "show"
    );

  }


  /* =========================
     غلق عند الضغط خارج الصورة
  ========================= */

  document
    .getElementById(
      "lightbox"
    )
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          this
        ) {

          closeLightbox();

        }

      }
    );


  /* =========================
     تشغيل الموقع
  ========================= */

  async function init() {

    await loadSiteSettings();

    await loadCategories();

    await loadDesigns();

  }


  init();

</script>

</body>
</html>
