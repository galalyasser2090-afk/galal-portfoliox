<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معرض أعمالي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,sans-serif;
background:#0b0b0f;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}


/* =====================================================
   SCROLL PROGRESS
===================================================== */

.scroll-progress{
position:fixed;
top:0;
right:0;
height:3px;
width:0%;
background:linear-gradient(
90deg,
#8b5cf6,
#00d4ff
);
z-index:10000;
box-shadow:0 0 12px #8b5cf6;
}


/* =====================================================
   INTRO
===================================================== */

.intro{
position:fixed;
inset:0;

background:
radial-gradient(
circle at center,
#171329 0%,
#0b0b0f 45%,
#050507 100%
);

display:flex;
justify-content:center;
align-items:center;

z-index:9999;
overflow:hidden;

animation:
introExit 1.2s cubic-bezier(.77,0,.18,1) 4.5s forwards;
}

.intro::before{
content:"";

position:absolute;

width:500px;
height:500px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(139,92,246,.22),
rgba(0,212,255,.08),
transparent 70%
);

filter:blur(25px);

animation:
glowMove 4s ease-in-out infinite alternate;
}

.intro-content{
position:relative;
z-index:5;
text-align:center;
width:min(900px,90%);
}

.intro-line{
width:0;
height:1px;

margin:15px auto;

background:
linear-gradient(
90deg,
transparent,
#8b5cf6,
#00d4ff,
transparent
);

animation:
lineGrow 1.2s ease forwards;
}

.intro-line:first-child{
animation-delay:.2s;
}

.intro-line:last-child{
animation-delay:1.7s;
}

.intro-name-wrap{
position:relative;
display:inline-block;
overflow:hidden;
padding:10px 25px;
}

.intro-name{
font-size:clamp(45px,8vw,95px);
font-weight:800;
letter-spacing:5px;

background:
linear-gradient(
90deg,
#fff,
#b9a1ff,
#fff,
#7eeeff,
#fff
);

background-size:300%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

opacity:0;

transform:
translateY(35px)
scale(.92);

filter:blur(12px);

animation:
nameReveal 1.4s cubic-bezier(.16,1,.3,1) .5s forwards,
gradientFlow 4s linear 1.8s infinite;
}

.name-shine{
position:absolute;

top:-20%;
left:-100%;

width:45%;
height:140%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.8),
transparent
);

transform:skewX(-20deg);

animation:
shineMove 1.4s ease 2s forwards;
}

.intro-subtitle{
margin-top:5px;

font-size:13px;
letter-spacing:7px;

color:rgba(255,255,255,.55);

opacity:0;

transform:translateY(15px);

animation:
subtitleShow 1s ease 1.7s forwards;
}


/* =====================================================
   PARTICLES
===================================================== */

.particles,
.particles::before,
.particles::after{
position:absolute;
content:"";
inset:0;

background-image:

radial-gradient(
circle,
rgba(139,92,246,.7) 1px,
transparent 2px
),

radial-gradient(
circle,
rgba(0,212,255,.5) 1px,
transparent 2px
),

radial-gradient(
circle,
rgba(255,255,255,.35) 1px,
transparent 2px
);

background-size:
140px 140px,
190px 190px,
240px 240px;

background-position:
0 0,
40px 80px,
100px 30px;

opacity:.35;
}

.particles{
animation:
particlesMove 12s linear infinite;
}

.particles::before{
animation:
particlesFloat 7s ease-in-out infinite alternate;
}

.particles::after{
animation:
particlesFloat 10s ease-in-out infinite alternate-reverse;
}


/* =====================================================
   HERO
===================================================== */

header{
min-height:75vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

padding:40px 20px;

position:relative;
overflow:hidden;

background:
radial-gradient(
circle at 50% 30%,
rgba(139,92,246,.25),
transparent 40%
),
#0b0b0f;
}

header::before{
content:"";

position:absolute;

width:600px;
height:600px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(139,92,246,.10),
transparent 70%
);

transform:translateY(
calc(var(--scrollY,0px) * .15)
);

pointer-events:none;
}

.hero{
max-width:900px;
position:relative;
z-index:2;

animation:
heroShow 1.2s ease .4s both;
}

.hero h1{
font-size:clamp(45px,8vw,90px);
margin-bottom:20px;

background:
linear-gradient(
90deg,
#fff,
#8b5cf6,
#00d4ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero h2{
font-size:clamp(22px,4vw,38px);
margin-bottom:20px;
}

.hero p{
color:#aaa;
font-size:18px;
line-height:1.8;
}


/* =====================================================
   CATEGORIES
===================================================== */

.categories{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;

padding:25px 20px;

position:sticky;
top:0;

z-index:100;

background:
rgba(11,11,15,.9);

backdrop-filter:blur(12px);

animation:
categoriesShow .8s ease both;
}

.category-btn{
border:1px solid #333;

background:#15151c;

color:white;

padding:11px 22px;

border-radius:30px;

cursor:pointer;

transition:
transform .3s,
background .3s,
border-color .3s,
box-shadow .3s;

font-size:15px;
}

.category-btn:hover,
.category-btn.active{
background:#8b5cf6;
border-color:#8b5cf6;

transform:translateY(-3px);

box-shadow:
0 8px 25px rgba(139,92,246,.25);
}


/* =====================================================
   PORTFOLIO
===================================================== */

.portfolio{
padding:80px 5%;

max-width:1500px;
margin:auto;
}

.portfolio h2{
text-align:center;
margin-bottom:45px;
font-size:35px;

opacity:0;

transform:translateY(35px);

transition:
opacity .8s ease,
transform .8s ease;
}

.portfolio h2.visible{
opacity:1;
transform:translateY(0);
}


/* =====================================================
   DESIGNS
===================================================== */

.designs{
display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(280px,1fr)
);

gap:25px;
}

.design-card{
background:#15151c;

border-radius:18px;

overflow:hidden;

border:1px solid #252530;

cursor:pointer;

opacity:0;

transform:
translateY(70px)
scale(.96);

transition:
opacity .8s cubic-bezier(.16,1,.3,1),
transform .8s cubic-bezier(.16,1,.3,1),
border-color .3s,
box-shadow .3s;
}

.design-card.visible{
opacity:1;

transform:
translateY(0)
scale(1);
}

.design-card:hover{
transform:
translateY(-10px)
scale(1.015);

border-color:#8b5cf6;

box-shadow:
0 20px 50px rgba(0,0,0,.45);
}

.design-card img{
width:100%;
height:280px;

object-fit:cover;
display:block;

transition:
transform .6s ease;
}

.design-card:hover img{
transform:scale(1.04);
}

.design-title{
padding:15px;
text-align:center;
color:#ddd;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty{
text-align:center;

color:#999;

padding:50px 20px;

font-size:18px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
text-align:center;

padding:60px 20px;

margin-top:50px;

background:#08080c;

border-top:1px solid #222;

opacity:0;

transform:translateY(40px);

transition:
opacity 1s ease,
transform 1s ease;
}

footer.visible{
opacity:1;
transform:translateY(0);
}

footer h3{
margin-bottom:15px;
font-size:25px;
}

footer p{
color:#999;
margin-bottom:20px;
}

.contact-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
}

.contact-buttons a{
text-decoration:none;

color:white;

background:#181820;

border:1px solid #333;

padding:12px 20px;

border-radius:10px;

transition:.3s;
}

.contact-buttons a:hover{
background:#8b5cf6;
border-color:#8b5cf6;

transform:translateY(-3px);
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{
position:fixed;
inset:0;

background:rgba(0,0,0,.92);

display:none;

align-items:center;
justify-content:center;

z-index:9998;

padding:20px;
}

.lightbox.show{
display:flex;
}

.lightbox img{
max-width:95%;
max-height:90vh;

object-fit:contain;

border-radius:10px;

animation:
imageOpen .4s ease;
}

.close{
position:absolute;

top:20px;
right:30px;

font-size:40px;

cursor:pointer;

color:white;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes nameReveal{

0%{
opacity:0;
transform:
translateY(35px)
scale(.92);

filter:blur(12px);
}

60%{
opacity:1;

transform:
translateY(-5px)
scale(1.02);

filter:blur(0);
}

100%{
opacity:1;

transform:
translateY(0)
scale(1);

filter:blur(0);
}
}

@keyframes gradientFlow{

0%{
background-position:0%;
}

100%{
background-position:300%;
}
}

@keyframes shineMove{

0%{
left:-100%;
}

100%{
left:150%;
}
}

@keyframes subtitleShow{

from{
opacity:0;
transform:translateY(15px);
letter-spacing:15px;
}

to{
opacity:1;
transform:translateY(0);
letter-spacing:7px;
}
}

@keyframes lineGrow{

from{
width:0;
opacity:0;
}

to{
width:min(420px,70%);
opacity:1;
}
}

@keyframes glowMove{

from{
transform:
translate(-80px,-20px)
scale(.9);
}

to{
transform:
translate(80px,20px)
scale(1.15);
}
}

@keyframes particlesMove{

from{
transform:translateY(0);
}

to{
transform:translateY(-100px);
}
}

@keyframes particlesFloat{

from{
transform:translate(0,0);
}

to{
transform:translate(30px,-40px);
}
}

@keyframes introExit{

0%{
opacity:1;
visibility:visible;
}

70%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
pointer-events:none;
}
}

@keyframes heroShow{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}
}

@keyframes categoriesShow{

from{
opacity:0;
transform:translateY(-20px);
}

to{
opacity:1;
transform:translateY(0);
}
}

@keyframes imageOpen{

from{
opacity:0;
transform:scale(.85);
}

to{
opacity:1;
transform:scale(1);
}
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

.design-card img{
height:230px;
}

.categories{
overflow-x:auto;
justify-content:flex-start;
flex-wrap:nowrap;
}

.intro-name{
letter-spacing:2px;
}

.intro-subtitle{
font-size:10px;
letter-spacing:4px;
}

.portfolio{
padding:
60px 20px;
}

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

*{
animation-duration:.01ms !important;
animation-iteration-count:1 !important;
transition-duration:.01ms !important;
scroll-behavior:auto !important;
}

}

</style>
</head>


<body>


<!-- =====================================================
     SCROLL PROGRESS
===================================================== -->

<div
class="scroll-progress"
id="scrollProgress">
</div>


<!-- =====================================================
     INTRO
===================================================== -->

<div
class="intro"
id="intro">

<div class="particles"></div>

<div class="intro-content">

<div class="intro-line"></div>

<div class="intro-name-wrap">

<div
class="intro-name"
id="introName">
Galal Yasser
</div>

<div class="name-shine"></div>

</div>

<div class="intro-subtitle">
GRAPHIC DESIGNER
</div>

<div class="intro-line"></div>

</div>

</div>


<!-- =====================================================
     HERO
===================================================== -->

<header>

<div class="hero">

<h1 id="siteName">
Galal Yasser
</h1>

<h2 id="headline">
Graphic Designer
</h2>

<p id="description">
أهلاً بك في معرض أعمالي
</p>

</div>

</header>


<!-- =====================================================
     CATEGORIES
===================================================== -->

<div
class="categories"
id="categories">

<button
class="category-btn active"
data-id="all">

كل التصميمات

</button>

</div>


<!-- =====================================================
     PORTFOLIO
===================================================== -->

<section
class="portfolio">

<h2 id="portfolioTitle">
تصميماتي
</h2>

<div
id="designs"
class="designs">

<div class="loading">
جاري تحميل التصميمات...
</div>

</div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer id="footer">

<h3>
تواصل معي
</h3>

<p>
يسعدني التواصل معك لتنفيذ تصميمك القادم
</p>

<div class="contact-buttons">

<a
id="phoneLink"
href="#">

📞 اتصال

</a>

<a
id="whatsappLink"
href="#"
target="_blank">

💬 واتساب

</a>

<a
id="vodafoneLink"
href="#">

💳 Vodafone Cash

</a>

</div>

</footer>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
class="lightbox"
id="lightbox">

<span
class="close"
id="closeLightbox">

×

</span>

<img
id="lightboxImage"
src=""
alt="">

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nsppbvbvdxuquqgkioxf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T1fzRxk45rH1AdML8s9gcg_5ZoBN8Qv";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allDesigns = [];

let allCategories = [];


const siteName =
document.getElementById(
"siteName"
);

const introName =
document.getElementById(
"introName"
);

const headline =
document.getElementById(
"headline"
);

const description =
document.getElementById(
"description"
);

const categoriesBox =
document.getElementById(
"categories"
);

const designsBox =
document.getElementById(
"designs"
);


/* =====================================================
   SETTINGS
===================================================== */

async function loadSiteSettings(){

const {data,error} =
await db
.from("site_settings")
.select("*")
.limit(1)
.maybeSingle();

if(error){

console.log(
"Settings error:",
error
);

return;
}

if(!data)return;


if(data.site_name){

siteName.textContent =
data.site_name;

introName.textContent =
data.site_name;

}


if(data.headline){

headline.textContent =
data.headline;

}


if(data.description){

description.textContent =
data.description;

}


if(data.phone){

document.getElementById(
"phoneLink"
).href =
"tel:"+data.phone;

}


if(data.whatsapp){

let whatsapp =
data.whatsapp.replace(
/\D/g,
""
);

if(
whatsapp.startsWith("01")
){

whatsapp =
"20"+
whatsapp.substring(1);

}

document.getElementById(
"whatsappLink"
).href =
"https://wa.me/"+
whatsapp;

}


if(data.vodafone_cash){

document.getElementById(
"vodafoneLink"
).href =
"tel:"+
data.vodafone_cash;

}

}


/* =====================================================
   CATEGORIES
===================================================== */

async function loadCategories(){

const {data,error} =
await db
.from("categories")
.select("*")
.order(
"created_at",
{
ascending:true
}
);

if(error){

console.log(
"Categories error:",
error
);

return;
}

allCategories =
data || [];


data.forEach(
function(category){

const button =
document.createElement(
"button"
);

button.className =
"category-btn";

button.textContent =
category.name;

button.dataset.id =
category.id;


button.addEventListener(
"click",
function(){

document
.querySelectorAll(
".category-btn"
)
.forEach(
function(btn){

btn.classList.remove(
"active"
);

}
);

button.classList.add(
"active"
);


const filtered =
allDesigns.filter(
function(design){

return (
design.category_id ===
category.id
);

}
);


renderDesigns(
filtered
);

}
);


categoriesBox.appendChild(
button
);

}
);

}


/* =====================================================
   DESIGNS
===================================================== */

async function loadDesigns(){

const {data,error} =
await db
.from("designs")
.select(
"id,title,image_url,category_id"
)
.order(
"created_at",
{
ascending:false
}
);

if(error){

console.log(
"Designs error:",
error
);

designsBox.innerHTML =
`
<div class="empty">
حدث خطأ أثناء تحميل التصميمات
</div>
`;

return;
}

allDesigns =
data || [];

showUncategorized();

}


/* =====================================================
   ALL DESIGNS
===================================================== */

function showUncategorized(){

const button =
document.querySelector(
'.category-btn[data-id="all"]'
);

document
.querySelectorAll(
".category-btn"
)
.forEach(
function(btn){

btn.classList.remove(
"active"
);

}
);

if(button){

button.classList.add(
"active"
);

}


const uncategorized =
allDesigns.filter(
function(design){

return (
design.category_id === null ||
design.category_id === undefined
);

}
);


renderDesigns(
uncategorized
);

}


/* =====================================================
   RENDER
===================================================== */

function renderDesigns(
designs
){

designsBox.innerHTML = "";


if(!designs.length){

designsBox.innerHTML =
`
<div class="empty">
لا توجد تصميمات في هذا القسم
</div>
`;

return;
}


designs.forEach(
function(design){

const card =
document.createElement(
"div"
);

card.className =
"design-card";


card.innerHTML =
`
<img
src="${design.image_url}"
alt="${escapeHtml(
design.title ||
"تصميم"
)}"
>

<div class="design-title">
${escapeHtml(
design.title ||
"تصميم"
)}
</div>
`;


card.addEventListener(
"click",
function(){

openLightbox(
design.image_url
);

}
);


designsBox.appendChild(
card
);

}
);


/* تشغيل أنيميشن الكروت */

setTimeout(
function(){

observeElements();

},
50
);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
text
){

const div =
document.createElement(
"div"
);

div.textContent =
text;

return div.innerHTML;

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(
imageUrl
){

document.getElementById(
"lightboxImage"
).src =
imageUrl;

document.getElementById(
"lightbox"
).classList.add(
"show"
);

}


document
.getElementById(
"closeLightbox"
)
.addEventListener(
"click",
function(){

document.getElementById(
"lightbox"
).classList.remove(
"show"
);

}
);


document
.getElementById(
"lightbox"
)
.addEventListener(
"click",
function(e){

if(
e.target.id ===
"lightbox"
){

document.getElementById(
"lightbox"
).classList.remove(
"show"
);

}

}
);


/* =====================================================
   ALL BUTTON
===================================================== */

document
.querySelector(
'.category-btn[data-id="all"]'
)
.addEventListener(
"click",
function(){

showUncategorized();

}
);


/* =====================================================
   SCROLL ANIMATION
===================================================== */

let observer;


function observeElements(){

if(observer){

observer.disconnect();

}


observer =
new IntersectionObserver(
function(entries){

entries.forEach(
function(entry){

if(entry.isIntersecting){

entry.target.classList.add(
"visible"
);

}

}
);
},
{
threshold:.12
}
);


document
.querySelectorAll(
".design-card, #portfolioTitle, #footer"
)
.forEach(
function(element){

observer.observe(
element
);

}
);

}


/* =====================================================
   SCROLL PROGRESS
===================================================== */

window.addEventListener(
"scroll",
function(){

const scrollTop =
window.scrollY;

const documentHeight =
document.documentElement.scrollHeight -
window.innerHeight;

const progress =
documentHeight > 0
?
(scrollTop /
documentHeight) * 100
:
0;

document.getElementById(
"scrollProgress"
).style.width =
progress+"%";


/* Parallax خفيف */

document.body.style.setProperty(
"--scrollY",
scrollTop+"px"
);

}
);


/* =====================================================
   START
===================================================== */

async function startSite(){

await loadSiteSettings();

await loadCategories();

await loadDesigns();

observeElements();

}


startSite();

</script>

</body>
</html>
